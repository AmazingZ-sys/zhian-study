services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zhian
      POSTGRES_USER: zhian
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - zhian_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhian -d zhian"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  zhian_pgdata:
